<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarayönü Ziraat Odası - Personel Girişi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #228B22, #87CEEB);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: white;
      padding: 50px 60px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      width: 420px;
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(-30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .logo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 6px solid #006400;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    h1 {
      color: #006400;
      font-size: 36px;
      margin-bottom: 8px;
    }
    h2 {
      color: #228B22;
      font-size: 26px;
      margin-bottom: 10px;
    }
    p {
      color: #555;
      margin-bottom: 30px;
      font-size: 18px;
    }
    input {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: 2px solid #006400;
      border-radius: 12px;
      font-size: 18px;
      outline: none;
      transition: 0.3s;
    }
    input:focus {
      border-color: #228B22;
      box-shadow: 0 0 10px rgba(34,139,34,0.3);
    }
    button {
      width: 100%;
      padding: 18px;
      background: #006400;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    button:hover {
      background: #228B22;
      transform: scale(1.03);
    }
    .error {
      color: #c00;
      font-weight: bold;
      margin-top: 15px;
      min-height: 24px;
    }
    .kose-link {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.95);
      color: #1a5276;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      border: 2px solid #2980b9;
      z-index: 100;
    }
    .kose-link:hover { background: #ebf5fb; }
  </style>
</head>
<body>

<a href="/mesai.html" class="kose-link"><i class="fas fa-clock"></i> Personel Mesai</a>

<div class="login-container">
  <img src="tzob-logo.png" alt="TZOB Logo" class="logo">
  <font size="5">HOŞGELDİNİZ</font>
  <h2>SARAYÖNÜ ZİRAAT ODASI</h2>
  <p>Personel Girişi</p>

  <input type="text" id="kullanici" placeholder="Kullanıcı adı veya e-posta" autocomplete="off">
  <input type="password" id="sifre" placeholder="Şifre">
  <button onclick="giris()">GİRİŞ YAP</button>

  <button type="button" onclick="location.href='/siramatik.html'" style="background:#fff;color:#006400;border:2px solid #006400;margin-top:14px;">
    SIRAMATİĞE GİT
  </button>

  <div class="error" id="hata"></div>
</div>

<script>
async function giris() {
  const kullanici = document.getElementById('kullanici').value.trim();
  const sifre = document.getElementById('sifre').value;
  const hata = document.getElementById('hata');

  if (!kullanici || !sifre) {
    hata.innerText = "Lütfen tüm alanları doldur";
    return;
  }

  hata.innerText = "Giriş yapılıyor...";

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ kullaniciadi: kullanici, email: kullanici, sifre })
    });

    const data = await res.json();

    if (data.success) {
      localStorage.setItem('token', data.token);
      location.href = '/anasayfa.html';
    } else {
      hata.innerText = data.message || "Giriş başarısız";
    }
  } catch (err) {
    hata.innerText = "Sunucu hatası";
  }
}

// Enter tuşu ile giriş
document.getElementById('sifre').addEventListener('keypress', e => {
  if (e.key === 'Enter') giris();
});
</script>

</body>
</html>
