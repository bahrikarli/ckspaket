<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Planlı Üretim Kaydı</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px}
  .kutu{max-width:1200px;margin:auto;background:white;padding:30px;border-radius:12px;box-shadow:0 6px 25px rgba(0,0,0,0.1)}
  h2{background:#006400;color:white;padding:18px;border-radius:10px;text-align:center;margin:-30px -30px 30px -30px;font-size:24px}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:25px;align-items:end}
  select,input{padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box}
  button{padding:12px 20px;background:#006400;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
  button:hover{background:#228B22}
  table{width:100%;border-collapse:collapse;margin-top:20px}
  th{background:#006400;color:white;padding:12px}
  td{padding:10px;border-bottom:1px solid #eee;text-align:center}
  .sil{background:#c62828;color:white;border:none;padding:6px 12px;border-radius:5px;cursor:pointer}
</style>
</head>
<body>

<div class="kutu">
  <h2>Planlı Üretim Kaydı</h2>

  <div class="form">
   <select id="il" class="select-style"><option value="">İL SEÇİN</option></select>
<select id="ilce" class="select-style" disabled><option>İLÇE SEÇİN</option></select>
<select id="mahalle" class="select-style" disabled><option>MAHALLE/KÖY SEÇİN</option></select>
    <input id="ada" type="number" placeholder="Ada" autocomplete="off">
    <input id="parsel" type="number" placeholder="Parsel" autocomplete="off">
    <input id="alan" type="number" step="0.01" placeholder="Alan (m²)">
<div style="position:relative;">
  <input type="text" id="urunArama" placeholder="Ürün adı ara veya yaz" autocomplete="off" style="width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:8px;">
  <select id="ürünadı" size="8" style="position:absolute;top:100%;left:0;width:100%;z-index:1000;display:none;background:white;border:1px solid #006400;border-radius:8px;max-height:300px;overflow-y:auto;">
    </select>
</div>
    <button onclick="ekle()">EKLE</button>
  </div>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="anaTik" onchange="hepsiniTikla(this.checked)"></th>
        <th>İl</th><th>İlçe</th><th>Mahalle</th><th>Ada</th><th>Parsel</th><th>Alan</th><th>Ürün</th><th>İşlem</th>
      </tr>
    </thead>
    <tbody id="liste"></tbody>
  </table>

  <div style="text-align:center;margin:60px 0;">
    <div style="margin-bottom: 20px;">
      <label for="raporTarihi" style="font-size: 18px; font-weight: bold; margin-right: 10px;">Rapor Tarihi:</label>
      <input type="date" id="raporTarihi" style="width: auto; display: inline-block;">
    </div>
    <button onclick="raporGoster()" style="padding:20px 80px;background:#c62828;color:white;border:none;border-radius:12px;font-size:24px;font-weight:bold;">
      RESMİ RAPORU AÇ (EK-8)
    </button>
  </div>
</div>

<div id="raporModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;overflow:auto;">
  <div style="background:white;margin:20px auto;padding:20px;max-width:950px;border-radius:12px;position:relative;">
    <button onclick="document.getElementById('raporModal').style.display='none'" 
            style="position:absolute;top:10px;right:15px;background:#c62828;color:white;border:none;padding:12px 18px;border-radius:50%;font-size:24px;cursor:pointer;z-index:10;">
      ×
    </button>
    <iframe id="raporIframe" style="width:100%;height:96vh;border:none;"></iframe>
  </div>
</div>

<script>
// --- SAYFA YÜKLENDİĞİNDE GÜNÜN TARİHİNİ İNPUTA ATA ---
document.addEventListener('DOMContentLoaded', () => {
  const dateInput = document.getElementById('raporTarihi');
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  dateInput.value = `${yyyy}-${mm}-${dd}`;
});
// -----------------------------------------------------

const kimlik = new URLSearchParams(location.search).get('kimlik') || 3276;
let iller = [], ilceler = [], mahalleler = [];

async function loadAll() {
  try {
    [iller, ilceler, mahalleler] = await Promise.all([
      fetch('/api/IL').then(r => r.json()),
      fetch('/api/ILCE').then(r => r.json()),
      fetch('/api/MAHALLE').then(r => r.json())
    ]);

    fillIl();
  } catch (e) {
    alert("Veri yüklenemedi, sunucu kapalı olabilir");
  }
}

function fillIl() {
  const select = document.getElementById('il');
  select.innerHTML = '<option value="">— İL SEÇİN —</option>';
  iller.forEach(x => {
    select.innerHTML += `<option value="${x.İL}">${x.İL}</option>`;
  });
  select.value = "KONYA";
  fillIlce(); 
}

function fillIlce() {
  const il = document.getElementById('il').value;
  const select = document.getElementById('ilce');
  select.innerHTML = '<option value="">— İLÇE SEÇİN —</option>';
  select.disabled = false;

  document.getElementById('mahalle').innerHTML = '<option value="">— MAHALLE SEÇİN —</option>';
  document.getElementById('mahalle').disabled = true;

  if (!il) return;

  const filt = ilceler.filter(x => x.İL?.trim() === il.trim());
  filt.forEach(x => {
    select.innerHTML += `<option value="${x.İLÇE.trim()}">${x.İLÇE.trim()}</option>`;
  });

  if (filt.find(x => x.İLÇE.trim() === 'SARAYÖNÜ')) {
    select.value = 'SARAYÖNÜ';
  }
  fillMahalle();
}

const urunler = [
  "BUĞDAY", "ARPA", "YULAF", "ÇAVDAR", "TRİTİKALE", "MISIR","NADAS",
  "NOHUT", "MERCİMEK", "FASULYE", "BEZELYE", "BAKLA",
  "AYÇİÇEĞİ", "KANOLA", "SOYA", "ASPİR",
  "ŞEKER PANCARI", "PAMUK", "TÜTÜN", "KETEN",
  "YONCA", "FİĞ", "KORUNGA", "ÜÇGÜL", "MACAR FİĞİ",
  "PATATES", "SOĞAN", "SARIMSAK", "DOMATES", "BİBER", "KABAK", "HAVUÇ",
  "ELMA", "ARMUT", "KİRAZ", "VİŞNE", "KAYISI", "ŞEFTALİ", "ERİK", "ÜZÜM",
  "KİMYON", "ANASON", "HAŞHAŞ", "ÇÖREKOTU", "REZENE"
];

function urunListesiDoldur() {
  const select = document.getElementById('ürünadı');
  select.innerHTML = '';
  urunler.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u;
    opt.textContent = u;
    select.appendChild(opt);
  });
}

const urunArama = document.getElementById('urunArama');
const urunSelect = document.getElementById('ürünadı');

urunArama.addEventListener('focus', () => {
  urunSelect.style.display = 'block';
  urunListesiDoldur();
  urunFiltrele('');
});

urunArama.addEventListener('input', () => {
  urunFiltrele(urunArama.value.toUpperCase());
});

urunArama.addEventListener('blur', () => {
  setTimeout(() => { urunSelect.style.display = 'none'; }, 200);
});

urunSelect.addEventListener('change', () => {
  urunArama.value = urunSelect.value;
  urunSelect.style.display = 'none';
});

function urunFiltrele(arama) {
  const options = urunSelect.options;
  for (let i = 0; i < options.length; i++) {
    const metin = options[i].textContent.toUpperCase();
    options[i].style.display = metin.includes(arama) ? '' : 'none';
  }
}

function fillMahalle() {
  const il = document.getElementById('il').value?.trim();
  const ilce = document.getElementById('ilce').value?.trim();
  const select = document.getElementById('mahalle');

  select.innerHTML = '';

  if (!il || !ilce) {
    select.disabled = true;
    return;
  }

  const filt = mahalleler.filter(x => 
    (x.İL || '').toString().trim().toUpperCase() === il.toUpperCase() &&
    (x.İLÇE || '').toString().trim().toUpperCase() === ilce.toUpperCase()
  );

  filt.forEach(x => {
    const val = (x.MAHALLE || '').toString().trim();
    if (val) {
      const opt = document.createElement('option');
      opt.value = val;
      opt.textContent = val;
      select.appendChild(opt);
    }
  });

  if (filt.length > 0) {
    select.disabled = false;
  } else {
    select.innerHTML = '<option value="">— MAHALLE BULUNAMADI —</option>';
    select.disabled = true;
  }
}

document.getElementById('il').onchange = fillIlce;
document.getElementById('ilce').onchange = fillMahalle;

async function yükle() {
  const res = await fetch('/api/planli?kimlik=' + kimlik);
  const data = await res.json();
  const tbody = document.getElementById('liste');
  tbody.innerHTML = '';
  data.forEach(x => {
    tbody.innerHTML += `<tr data-id="${x.kimlik}">
      <td><input type="checkbox" ${x.tik ? 'checked' : ''} onchange="tikGuncelle(${x.kimlik},this.checked)"></td>
      <td>${x.il||''}</td><td>${x.ilçe||''}</td><td>${x.mahalle||''}</td>
      <td>${x.ada ?? ''}</td><td>${x.parsel ?? ''}</td><td>${x.alan||''}</td><td>${x.ürünadı||''}</td>
      <td><button class="sil" onclick="sil(${x.kimlik})">SİL</button></td>
    </tr>`;
  });
}

async function ekle() {
  const yeni = {
    kimlikid: kimlik,
    il: document.getElementById('il').value,
    ilçe: document.getElementById('ilce').value,
    mahalle: document.getElementById('mahalle').value,
    ada: +document.getElementById('ada').value || 0,
    parsel: +document.getElementById('parsel').value || 0,
    alan: +document.getElementById('alan').value || 0,
    ürünadı: urunArama.value.trim().toUpperCase(),
    tik: 1
  };
  if (!yeni.mahalle || !yeni.ürünadı) return alert('Mahalle ve Ürün adı zorunlu!');
  await fetch('/api/planli', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(yeni)});
  document.getElementById('ada').value = '';
  document.getElementById('parsel').value = '';
  document.getElementById('alan').value = '';
  yükle();
}

async function tikGuncelle(id, val) {
  await fetch(`/api/planli/${id}`, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({tik:val?1:0})});
}

async function sil(id) {
  if(confirm('Sil?')) await fetch(`/api/planli/${id}`,{method:'DELETE'}).then(yükle);
}

function hepsiniTikla(t) {
  document.querySelectorAll('#liste input[type=checkbox]').forEach(cb => {
    cb.checked = t;
    tikGuncelle(cb.closest('tr').dataset.id, t?1:0);
  });
}

loadAll();
yükle();

async function raporGoster() {
  try {
    const res = await fetch('/api/planli?kimlik=' + kimlik);
    const data = await res.json();
    const tikliler = data.filter(x => x.tik == 1);

    if (tikliler.length === 0) {
      alert("Rapor için tik işaretli kayıt yok!");
      return;
    }

    // Seçilen tarihi formattan gün.ay.yıl şekline dönüştür
    const secilenTarih = document.getElementById('raporTarihi').value;
    let formatliTarih = new Date().toLocaleDateString('tr-TR'); // Varsayılan anlık
    if (secilenTarih) {
      const [yil, ay, gun] = secilenTarih.split('-');
      formatliTarih = `${gun}.${ay}.${yil}`;
    }

    const urlParams = new URLSearchParams(location.search);
    const rawTc = (urlParams.get('tc') || '').trim();
    const adsoyad = decodeURIComponent(urlParams.get('adsoyad') || 'İSA VELİ');
    const telefon = urlParams.get('tel') || '-';
    const adres = decodeURIComponent(urlParams.get('ilcekoy') || 'Konya Sarayönü');

    // GERÇEK / TÜZEL KİŞİ AYRIMI MANTIĞI
    const isSirket = rawTc.length === 10;
    const etiketKimlik = isSirket ? "Vergi No:" : "T.C. Kimlik No:";
    const etiketAdSoyad = isSirket ? "Şirket/Kurum Unvanı:" : "Adı Soyadı:";

    let satirlar = '';
    tikliler.forEach(item => {
      satirlar += `<tr style="height:21px;font-size:14px;">
        <td style="padding:6px;">${item.il || 'KONYA'}</td>
        <td style="padding:6px;">${item.ilçe || 'SARAYÖNÜ'}</td>
        <td style="padding:6px;">${item.mahalle || ''}</td>
        <td style="padding:6px;text-align:center;">${item.ada === 0 ? 0 : item.ada || ''}</td>
        <td style="padding:6px;text-align:center;">${item.parsel === 0 ? 0 : item.parsel || ''}</td>
        <td style="padding:6px;text-align:right;">${(item.alan || 0).toFixed(2)}</td>
        <td style="padding:6px;">${item.ürünadı || ''}</td>
        <td style="padding:6px;"></td>
      </tr>`;
    });

const raporHTML = `<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>EK-8 </title>
<style>

  font-family: Arial, sans-serif; 
  font-size: 12px; 
  margin: 0; 
  padding: 15mm; /* İçerik taşmasın diye sayfa içi padding verildi */
  background: white; 
  line-height: 1.2; 
}

.baslik{text-align:center;font-size:20px;font-weight:bold;margin-bottom:15px}
table{width:100%;border-collapse:collapse;margin:10px 0}
td,th{border:1px solid #000;padding:2px; font-size: 11px;} 

.sol{width:28%;background:#f0f0f0;font-weight:bold}

.tablo th{
    background:#e0e0e0;
    padding: 2px;
    font-size: 11px;
    height: 10px; 
}

.tablo td {
    padding: 1px 2px !important; 
    font-size: 11px;
    line-height: 0.5; 
    height: 8px; 
}

.imza-kapsayici table {
    page-break-inside: avoid; /* İmza tablosunun bölünmesini engeller */
    break-inside: avoid;
}

</style></head>
<body onload="window.print(); setTimeout(() => window.parent.document.getElementById('raporModal').style.display='none', 1000);">
<div class="baslik">PLANLI ÜRETİM BİLDİRİM FORMU</div>
<table>
<tr><td class="sol" style="padding: 2px;">${etiketKimlik}</td><td style="padding: 2px;">${rawTc || '-'}</td></tr>
<tr><td class="sol" style="padding: 2px;">${etiketAdSoyad}</td><td style="padding: 2px;">${adsoyad.toUpperCase()}</td></tr>
<tr><td class="sol" style="padding: 2px;">İkametgah Adresi:</td><td style="padding: 2px;">${adres}</td></tr>
<tr><td class="sol" style="padding: 2px;">Telefon:</td><td style="padding: 2px;">${telefon}</td></tr>
</table>
<div style="font-weight:bold;margin:15px 0 8px; font-size: 12px;">Bitkisel Üretim Planlamasında Uygun Olmayan Arazi Bilgileri</div>
<table class="tablo">
<tr style="height: 10px;">
<th>İl</th><th>İlçe</th><th>Köy/Mahalle</th><th>Ada</th><th>Parsel</th><th>Alan(m²)</th><th>Ürün</th><th>Uygun Olmama Gerekçesi</th></tr>
${satirlar}</table>
<div style="margin-top:30px;font-size:11px; line-height: 1.3;">İl/İlçe Müdürlüğüne yapmış olduğunuz Çiftçi Kayıt Sistemi (ÇKS) basvurusunda yukarıda bilgileri
verilen parseller için beyan edilen ürünler 14/9/2023 tarihli ve 32309 sayılı Resmi Gazete'de yayımlanan
Tarımsal Üretim Planlaması Hakkında Yönetmeliğe aykırı olduğu için üretim izni verilmemiştir.
</div>
<div style="margin-top:20px;font-size:11px; line-height: 1.3;">Tarım Kanununun 7 nci maddesi kapsamında bu tarihten itibaren on iki (12) ay içerisinde tarımsal
üretim planına uygun faaliyette bulunmaması halinde beş yıl süreyle tarımsal desteklemelerden
yararlandırılmayacağı, bir sonraki takvim yılında da üretim planlamasına aykırılığın devam etmesi
durumunda bu faaliyetten elde edilecek yıllık brüt hasılanın %1-5'i kadar idari para cezası uygulanacağı
tebliğ edilmiştir.
</div>

<div class="imza-kapsayici">
<table style="width:100%; margin-top: 30px; border-collapse: collapse;">
  <tr>
    <th style="width:28%;"></th>
    <th style="width:36%; text-align:center;">Tebliğ Eden</th>
    <th style="width:36%; text-align:center;">Tebellüğ Eden</th>
  </tr>
  <tr>
    <td style="font-weight:bold; padding: 4px;">${etiketAdSoyad}</td>
    <td style="padding: 4px;"></td>
    <td style="height: 30px; text-align:center; padding: 4px;"><br>${adsoyad.toUpperCase()}</td>
  </tr>
  <tr>
    <td style="font-weight:bold; padding: 4px;">Tarih</td>
    <td style="padding: 4px;"></td>
    <td style="text-align:center; padding: 4px;">${formatliTarih}</td>
  </tr>
  <tr>
    <td style="font-weight:bold; padding: 4px;">İmza</td>
    <td style="padding: 4px;"></td>
    <td style="padding: 4px;"></td>
  </tr>
</table>
</div>

</body></html>`;

    const iframe = document.getElementById('raporIframe');
    const blob = new Blob([raporHTML], {type: 'text/html'});
    iframe.src = URL.createObjectURL(blob);

    document.getElementById('raporModal').style.display = 'block';

  } catch (err) {
    alert("Rapor oluşturulamadı: " + err.message);
  }
}
</script>
</body>
</html>
