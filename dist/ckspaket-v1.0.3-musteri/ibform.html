<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>2926 İşlemleri</title>
<style>
    body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
    .form-container { border: 1px solid #ccc; border-radius: 8px; padding: 20px; background: #fdfdfd; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h3 { text-align: center; border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #333; margin-top: 0; }
    .hizli-ekle { background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #ddd; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .input-grup { flex: 1; min-width: 120px; }
    .input-grup label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px; }
    .input-grup input, .input-grup select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { padding: 9px 15px; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-yesil { background: #28a745; } .btn-kirmizi { background: #dc3545; } .btn-mavi { background: #007bff; } .btn-gri { background: #6c757d; }
    .tablo-alani { max-height: 350px; overflow-y: auto; border: 1px solid #ddd; margin-bottom: 20px; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { padding: 10px; background: #e9ecef; border-bottom: 1px solid #ccc; position: sticky; top: 0; z-index: 10; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    .aksiyon-butonlari { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; padding-top: 15px; }
    
    /* Geçmiş Modal Stilleri */
    #gecmisModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; }
    .gecmis-content { background:#fff; width:600px; max-width:90%; margin:50px auto; padding:20px; border-radius:8px; box-shadow:0 5px 15px rgba(0,0,0,0.3); }
    .gecmis-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .gecmis-header h4 { margin: 0; color: #333; }
    .kapat-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #666; }
    
    /* Zarif Bildirim (Toast) Stilleri */
    #toast {
        visibility: hidden; min-width: 250px; background-color: #28a745; color: #fff;
        text-align: center; border-radius: 6px; padding: 15px 20px; position: fixed;
        z-index: 9999999; right: 20px; bottom: 30px; font-size: 15px; font-weight: bold;
        box-shadow: 0px 5px 15px rgba(0,0,0,0.3); transition: opacity 0.4s, transform 0.4s;
        opacity: 0; transform: translateY(20px);
    }
    #toast.goster { visibility: visible; opacity: 1; transform: translateY(0); }

    /* Üst Bilgi Grubu Tasarımı */
    .ust-bilgi-konteynir { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; padding: 20px; background-color: #fff; border: 1px solid #e1e4e8; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .bilgi-kutusu { display: flex; flex-direction: column; }
    .bilgi-kutusu label { font-size: 13px; font-weight: 700; color: #495057; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .bilgi-kutusu input { padding: 10px 12px; border: 1px solid #ced4da; border-radius: 6px; font-size: 14px; transition: all 0.2s ease-in-out; background-color: #fcfcfc; }
    .bilgi-kutusu input:focus { border-color: #007bff; background-color: #fff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); outline: none; }
</style>
</head>
<body>

<div class="form-container">
    <h3>2926 Sayılı Kanun - Ziraat Odası İşlemleri</h3>
    
    <div class="ust-bilgi-konteynir">
        <div class="bilgi-kutusu">
            <label>Sicil No</label>
            <input type="text" id="sicilNo" placeholder="Örn: 15792" onblur="otomatikKaydet()">
        </div>
        <div class="bilgi-kutusu">
            <label>Ana Adı</label>
            <input type="text" id="anaAdi" placeholder="Ana Adı" onblur="otomatikKaydet()">
        </div>
        <div class="bilgi-kutusu">
            <label>Doğum Yeri</label>
            <input type="text" id="dogumYeri" placeholder="Doğum Yeri" onblur="otomatikKaydet()">
        </div>
        <div class="bilgi-kutusu">
            <label>Bağ-Kur No</label>
            <input type="text" id="bagkurNo" placeholder="Bağ-Kur No" onblur="otomatikKaydet()">
        </div>
    </div>

    <div class="hizli-ekle">
        <div class="input-grup">
            <label>İşlem Türü</label>
            <select id="islemTuru">
                <option value="Normal">Normal Kayıt</option>
                <option value="Muafiyet">Muafiyet</option>
            </select>
        </div>
        <div class="input-grup">
            <label>Od. Kay. Tar. (Giriş)</label>
            <input type="text" id="tarihGiris" placeholder="Örn: 27.06.2001">
        </div>
        <div class="input-grup">
            <label>Silindiği Tarih (Çıkış)</label>
            <input type="text" id="tarihCikis" placeholder="Örn: 31.12.2009">
        </div>
        <div class="input-grup">
            <label>Karar Tarihi/Sayısı</label>
            <input type="text" id="kararSayi" placeholder="Tarih / Sayı">
        </div>
        <button type="button" onclick="satirEkle()" class="btn btn-yesil">+ Ekle</button>
    </div>

    <div class="tablo-alani">
        <table>
            <thead>
                <tr>
                    <th>Tür</th><th>Giriş Tarihi</th><th>Çıkış Tarihi</th><th>Karar / Sayı</th><th style="text-align: center;">İşlem</th>
                </tr>
            </thead>
            <tbody id="kayitlarBody">
                <tr><td colspan="5" style="text-align: center; color: #666;">Yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="aksiyon-butonlari">
        <button type="button" class="btn btn-gri" onclick="gecmisModaliniAc()">
            📜 Geçmiş Raporlar
        </button>
        <button onclick="pdfRaporuBas()" class="btn btn-mavi">
            🖨️ Raporu Hazırla
        </button>
    </div>
</div>

<div id="toast"></div>

<div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
    <div style="background:#fff; width:400px; margin:100px auto; padding:20px; border-radius:8px; box-shadow:0 5px 15px rgba(0,0,0,0.3);">
        <h4 style="margin-top:0; border-bottom:1px solid #eee; padding-bottom:10px;">Kaydı Düzenle</h4>
        <div class="input-grup" style="margin-bottom:10px;"><label>İşlem Türü</label><select id="editTur" style="width:100%; padding:8px;"><option value="Normal">Normal Kayıt</option><option value="Muafiyet">Muafiyet</option></select></div>
        <div class="input-grup" style="margin-bottom:10px;"><label>Giriş Tarihi</label><input type="text" id="editGiris" style="width:100%; padding:8px;"></div>
        <div class="input-grup" style="margin-bottom:10px;"><label>Çıkış Tarihi</label><input type="text" id="editCikis" style="width:100%; padding:8px;"></div>
        <div class="input-grup" style="margin-bottom:15px;"><label>Karar / Sayı</label><input type="text" id="editKarar" style="width:100%; padding:8px;"></div>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button type="button" onclick="modalKapat()" class="btn btn-gri">İptal</button>
            <button type="button" id="btnGuncelle" class="btn btn-mavi">Güncelle</button>
        </div>
    </div>
</div>

<div id="gecmisModal">
    <div class="gecmis-content">
        <div class="gecmis-header">
            <h4>📜 Çiftçinin Geçmiş Rapor Çıktıları</h4>
            <button class="kapat-btn" onclick="gecmisModaliniKapat()">✖</button>
        </div>
        <div class="tablo-alani" style="max-height: 250px;">
            <table>
                <thead>
                    <tr>
                        <th>Rapor ID</th><th>Basım Tarihi</th><th>Personel</th><th style="text-align: right;">İşlemler</th>
                    </tr>
                </thead>
                <tbody id="gecmisListBody">
                    <tr><td colspan="4" style="text-align: center;">Yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="onayModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100000; align-items:center; justify-content:center;">
    <div style="background:white; width:80%; height:90%; border-radius:15px; display:flex; flex-direction:column; padding:20px;">
        <h3 style="margin-top:0; color:#006400;">📄 Seçili Dosyayı Onaylıyor musunuz?</h3>
        <p id="onayDosyaAdi" style="font-weight:bold; color:#555;"></p>
        <iframe id="onayIframe" style="flex:1; border:1px solid #ddd; border-radius:8px; margin-bottom:15px;"></iframe>
        <div style="display:flex; justify-content:flex-end; gap:15px;">
            <button onclick="yuklemeyiIptalEt()" style="background:#dc3545; color:white; border:none; padding:12px 25px; border-radius:8px; cursor:pointer; font-weight:bold;">❌ Vazgeç</button>
            <button onclick="asilYuklemeyiBaslat()" style="background:#28a745; color:white; border:none; padding:12px 25px; border-radius:8px; cursor:pointer; font-weight:bold;">✅ Evet, Yükle</button>
        </div>
    </div>
</div>

<div id="evrakOnizlemeModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999999;">
    <div style="background:white; width:90%; height:92%; margin: 2% auto; border-radius:12px; display:flex; flex-direction:column; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
        
        <div style="padding:15px 20px; background:#f8f9fa; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; border-radius: 12px 12px 0 0;">
            <h4 id="evrakModalBaslik" style="margin:0; color:#2c3e50;">📄 Rapor Önizleme</h4>
            <button onclick="evrakModalKapat()" style="background:none; border:none; font-size:30px; cursor:pointer; color:#dc3545; line-height:1;">&times;</button>
        </div>
        
        <iframe id="evrakIframe" style="flex:1; border:none; width:100%; height:100%;"></iframe>
        
        <div style="padding:10px 20px; background:#f8f9fa; border-top:1px solid #eee; text-align:right; border-radius: 0 0 12px 12px;">
            <button onclick="evrakModalKapat()" style="background:#6c757d; color:white; border:none; padding:10px 25px; border-radius:6px; cursor:pointer; font-weight:bold;">Kapat</button>
        </div>
    </div>
</div>


<script>
const getKimlikId = () => new URLSearchParams(window.location.search).get('kimlik');

function bildirimGoster(mesaj) {
    const toast = document.getElementById("toast");
    if (toast) {
        toast.innerHTML = mesaj;
        toast.classList.add("goster");
        setTimeout(() => { toast.classList.remove("goster"); }, 3000);
    }
}

// 🎯 YENİ: KENDİ İÇİNDEKİ ÖNİZLEME FONKSİYONLARI (Sorunsuz Yazdırma İçin)
function evrakOnizle(dosyaYolu, baslik) {
    document.getElementById('evrakModalBaslik').innerText = baslik;
    document.getElementById('evrakIframe').src = dosyaYolu;
    document.getElementById('evrakOnizlemeModal').style.display = 'block'; // Flex değil, Block!
}

function evrakModalKapat() {
    document.getElementById('evrakOnizlemeModal').style.display = 'none';
    document.getElementById('evrakIframe').src = ""; 
}

async function verileriYukle() {
    const kimlikId = getKimlikId();
    if (!kimlikId) return;

    try {
        const res = await fetch(`/api/ib/getir/${kimlikId}`);
        const data = await res.json();

        if (data.success) {
            if (data.sicilBilgisi) {
                const setVal = (id, val) => { if(document.getElementById(id)) document.getElementById(id).value = val || ''; };
                setVal('sicilNo', data.sicilBilgisi.sicil);
                setVal('anaAdi', data.sicilBilgisi.ana);
                setVal('dogumYeri', data.sicilBilgisi.dogyer);
                setVal('bagkurNo', data.sicilBilgisi.bagkurno);
            }

            const tbody = document.getElementById('kayitlarBody');
            tbody.innerHTML = ''; 

            if (data.tabloVerileri && data.tabloVerileri.length > 0) {
                data.tabloVerileri.forEach(d => {
                    const formatla = (t) => {
                        if (!t) return "../../....";
                        const dt = new Date(t);
                        if (dt.getFullYear() <= 1900) return "../../....";
                        return dt.toLocaleDateString('tr-TR');
                    };

                    let tr = `
                        <tr class="kayit-satiri" style="${d.tür === 'Muafiyet' ? 'background:#fff3cd' : ''}">
                            <td class="td-tur">${d.tür || ''}</td>
                            <td class="td-giris">${formatla(d.tarih)}</td>
                            <td class="td-cikis">${formatla(d.tarihh)}</td>
                            <td class="td-karar">${d.aciklama || ''}</td>
                            <td style="text-align: center;">
                                <button type="button" onclick="satirDuzenle(this)" style="color: blue; background: none; border: none; cursor: pointer; font-weight: bold; margin-right: 10px;">✎</button>
                                <button type="button" onclick="satirSil(this)" style="color: red; background: none; border: none; cursor: pointer; font-weight: bold;">X</button>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Kayıt bulunmamaktadır.</td></tr>`;
            }
        }
    } catch (e) {
        console.error("Veri çekme hatası:", e);
    }
}

window.otomatikKaydet = async function() {
    const kimlikId = getKimlikId();
    if (!kimlikId) return;

    const getVal = (id) => document.getElementById(id) ? document.getElementById(id).value : '';
    
    const veriPaketi = {
        kimlikid: kimlikId,
        sicil: getVal('sicilNo'),
        ana: getVal('anaAdi'),
        dogyer: getVal('dogumYeri'),
        bagkurno: getVal('bagkurNo'),
        veriler: []
    };

    document.querySelectorAll('.kayit-satiri').forEach(tr => {
        veriPaketi.veriler.push({
            tur: tr.querySelector('.td-tur').innerText,
            tarih: tr.querySelector('.td-giris').innerText,
            tarihh: tr.querySelector('.td-cikis').innerText,
            aciklama: tr.querySelector('.td-karar').innerText
        });
    });

    try {
        await fetch('/api/ib/kaydet', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(veriPaketi)
        });
    } catch (e) { console.error("Bağlantı hatası:", e); }
}

function satirEkle() {
    try {
        const islemTuruEl = document.getElementById('islemTuru');
        const tarihGirisEl = document.getElementById('tarihGiris');
        const tarihCikisEl = document.getElementById('tarihCikis');
        const kararSayiEl = document.getElementById('kararSayi');

        if (!tarihGirisEl || !islemTuruEl) return; 

        const tur = islemTuruEl.value;
        const giris = tarihGirisEl.value.trim();
        const cikis = tarihCikisEl.value.trim();
        const karar = kararSayiEl.value.trim();

        if (!giris) return alert("Lütfen Giriş Tarihi alanını doldurun!"); 

        const tbody = document.getElementById('kayitlarBody');
        if (tbody.innerHTML.includes('Kayıt bulunmamaktadır') || tbody.innerHTML.includes('Yükleniyor')) tbody.innerHTML = '';

        const tr = `
            <tr class="kayit-satiri" style="${tur === 'Muafiyet' ? 'background:#fff3cd' : ''}">
                <td class="td-tur">${tur}</td>
                <td class="td-giris">${giris}</td>
                <td class="td-cikis">${cikis}</td>
                <td class="td-karar">${karar}</td>
                <td style="text-align: center;">
                    <button type="button" onclick="satirDuzenle(this)" style="color: blue; background: none; border: none; cursor: pointer; font-weight: bold; margin-right: 10px;">✎</button>
                    <button type="button" onclick="satirSil(this)" style="color: red; background: none; border: none; cursor: pointer; font-weight: bold;">X</button>
                </td>
            </tr>`;

        tbody.insertAdjacentHTML('beforeend', tr);
        otomatikKaydet();
        
        tarihGirisEl.value = ""; tarihCikisEl.value = ""; kararSayiEl.value = "";
    } catch(e) { console.error("Satır Ekleme Hatası:", e); }
}

let aktifSatir = null; 
function satirDuzenle(buton) {
    aktifSatir = buton.closest('tr'); 
    document.getElementById('editTur').value = aktifSatir.querySelector('.td-tur').innerText;
    document.getElementById('editGiris').value = aktifSatir.querySelector('.td-giris').innerText;
    document.getElementById('editCikis').value = aktifSatir.querySelector('.td-cikis').innerText;
    document.getElementById('editKarar').value = aktifSatir.querySelector('.td-karar').innerText;
    document.getElementById('editModal').style.display = 'block';

    document.getElementById('btnGuncelle').onclick = function() {
        const yeniTur = document.getElementById('editTur').value;
        aktifSatir.querySelector('.td-tur').innerText = yeniTur;
        aktifSatir.querySelector('.td-giris').innerText = document.getElementById('editGiris').value;
        aktifSatir.querySelector('.td-cikis').innerText = document.getElementById('editCikis').value;
        aktifSatir.querySelector('.td-karar').innerText = document.getElementById('editKarar').value;
        aktifSatir.style.background = (yeniTur === 'Muafiyet' ? '#fff3cd' : '');

        modalKapat();
        otomatikKaydet();
    };
}

function modalKapat() { document.getElementById('editModal').style.display = 'none'; aktifSatir = null; }

function satirSil(buton) {
    if (confirm("Bu kaydı silmek istediğinize emin misiniz?")) {
        buton.closest('tr').remove();
        setTimeout(otomatikKaydet, 100); 
    }
}

// 🎯 GÜNCELLENMİŞ VE DOĞRUDAN İÇERİDEKİ MODALI ÇAĞIRAN RAPOR BASMA
function pdfRaporuBas() {
    const kimlikId = getKimlikId();
    if (!kimlikId) {
        alert("Kimlik bilgisi bulunamadı!");
        return;
    }

    let aktifPersonel = "BAHRİ KARLI"; 
    try {
        const storedName = localStorage.getItem('personelAd');
        if (storedName) {
            aktifPersonel = storedName;
        } else if (window.parent && window.parent.aktifPersonelAdSoyad) {
            aktifPersonel = window.parent.aktifPersonelAdSoyad;
        }
    } catch (e) { }

    // 🎯 İSTEDİĞİN NET UYARI MESAJI BURADA EKLENDİ
    alert("✅ Rapor sisteme işlenmiştir. 'Geçmiş Raporlar' Butonundan takip edebilir, tarama ekleyebilirsiniz.");

    const url = `/api/ib/rapor/${kimlikId}?personel=${encodeURIComponent(aktifPersonel)}`;
    
    // Uyarıdan sonra rapor modalda açılır
    evrakOnizle(url, "2926 Sayılı Kanun - Rapor Önizleme");
    
    // Sağ alttaki yeşil bildirimi de destekleyici şekilde değiştirdik
    bildirimGoster(`Sisteme İşlendi. İşlem Yapan: ${aktifPersonel}`);
}

async function gecmisModaliniAc() {
    const kimlikId = getKimlikId();
    if (!kimlikId) return;

    document.getElementById('gecmisModal').style.display = 'block';
    const tbody = document.getElementById('gecmisListBody');
    tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Veriler çekiliyor...</td></tr>';

    try {
        const res = await fetch(`/api/ib/gecmis-listesi/${kimlikId}`);
        const data = await res.json();
        tbody.innerHTML = '';
        
        if (data && data.length > 0) {
            data.forEach(g => {
                const logID = g.LogID;
                const hasTarama = g.TaramaYolu && g.TaramaYolu !== "" && g.TaramaYolu !== null;

                const taramaButonYapisi = hasTarama 
                    ? `<button onclick="taramaGoster(${logID})" style="background:#28a745; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">📂 Tarananı Aç</button>`
                    : `<button onclick="enSonTaramayiGetir(${logID})" style="background:#6c757d; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">🔍 Son Taramayı Bul</button>`;
                
                const tr = `
                    <tr>
                        <td style="font-weight:bold;">#${logID}</td>
                        <td>${g.BasimTarihiFormatli}</td>
                        <td>${g.Personel}</td>
                        <td style="text-align: right; display:flex; justify-content:flex-end; gap:5px;">
                            <button onclick="eskiRaporuAc(${logID})" style="background:#17a2b8; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">🔍 Sistem Önizle</button>
                            ${taramaButonYapisi}
                            <button onclick="eskiRaporuSil(${logID}, this)" style="background:#dc3545; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px;">✖</button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', tr);
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Arşivlenmiş rapor bulunmuyor.</td></tr>';
        }
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color:red;">Veriler yüklenirken hata oluştu!</td></tr>';
    }
}

function gecmisModaliniKapat() { document.getElementById('gecmisModal').style.display = 'none'; }

function yuklemeyiIptalEt() {
    document.getElementById('onayModal').style.display = 'none';
    document.getElementById('onayIframe').src = "";
    seciliHavuzDosyasi = null;
}

let seciliHavuzDosyasi = null;
let seciliLogId = null;

async function enSonTaramayiGetir(logId) {
    seciliLogId = logId; 
    try {
        const res = await fetch('/api/ib/en-son-tarama');
        const data = await res.json();

        if (data.success) {
            seciliHavuzDosyasi = data.dosyaAdi; 
            const önizlemeUrl = `/api/ib/havuzdan-oku/${data.dosyaAdi}`;
            document.getElementById('onayIframe').src = önizlemeUrl;
            document.getElementById('onayDosyaAdi').innerText = "Tespit Edilen Dosya: " + data.dosyaAdi;
            document.getElementById('onayModal').style.display = 'flex';
        } else {
            alert("⚠️ Havuzda PDF dosyası bulunamadı! Önce taratın.");
        }
    } catch (e) { alert("Sunucu bağlantı hatası!"); }
}

async function asilYuklemeyiBaslat() {
    if (!seciliHavuzDosyasi || !seciliLogId) return alert("Dosya veya Rapor ID tespit edilemedi!");

    try {
        document.getElementById('onayModal').style.display = 'none';
        bildirimGoster("⌛ Arşive taşınıyor...");

        const res = await fetch('/api/ib/havuzdan-onayla', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ logId: seciliLogId, dosyaAdi: seciliHavuzDosyasi })
        });

        const data = await res.json();
        if (data.success) {
            bildirimGoster(`✅ PDF başarıyla arşive eklendi!`);
            gecmisModaliniAc(); 
        } else { alert("Hata: " + data.message); }
    } catch (e) { alert("Sunucu bağlantı hatası!"); }
}

function taramaGoster(logId) {
    // Taranan belgeyi de yeni sekme yerine modalda açıyoruz!
    const url = `/api/ib/tarama-oku/${logId}`;
    evrakOnizle(url, "Arşivdeki Taranmış Belge");
}

function eskiRaporuAc(logId) {
    // Eski raporu da modalda açıyoruz!
    const url = `/api/ib/rapor-gecmis/${logId}`;
    evrakOnizle(url, "Geçmiş Rapor Önizleme");
}

async function eskiRaporuSil(logId, btn) {
    if (!confirm(`⚠️ DİKKAT: #${logId} nolu kayıt ve PDF KALICI OLARAK silinecek. Onaylıyor musunuz?`)) return;

    try {
        const res = await fetch(`/api/ib/gecmis-sil/${logId}`, { method: 'DELETE' });
        const data = await res.json();

        if (data.success) {
            bildirimGoster("🗑️ Kayıt tamamen temizlendi.");
            if (btn) {
                const satir = btn.closest('tr');
                if (satir) {
                    satir.style.transition = "all 0.4s";
                    satir.style.opacity = "0";
                    setTimeout(() => satir.remove(), 400);
                }
            } else { gecmisModaliniAc(); }
        } else { alert("❌ Silme başarısız: " + data.message); }
    } catch (e) { alert("Sunucu bağlantı hatası!"); }
}

setTimeout(verileriYukle, 300);
</script>
