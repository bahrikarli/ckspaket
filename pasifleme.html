<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Arazi Pasifleme Beyanı</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial, sans-serif; background: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
  .modal-container { background: #fff; width: 100%; max-width: 1000px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); overflow: hidden; }
  
  /* Üst Kırmızı Başlık */
  .modal-header { background: #8B0000; color: white; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; position: relative; }
  .close-btn { position: absolute; right: 15px; top: 15px; background: #5c0000; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }
  
  .modal-body { padding: 25px; }

  /* Bilgi Kartı */
  .info-box { background: #fff5f5; border: 1px solid #ffebee; padding: 15px; border-radius: 6px; margin-bottom: 20px; color: #333; display: flex; flex-wrap: wrap; gap: 15px 30px; font-size: 15px; }
  .info-box span { font-weight: bold; color: #8B0000; }

  /* Form Alanı */
  .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
  select, input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
  .btn-ekle { background: #8B0000; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .btn-ekle:hover { background: #a00000; }

  /* Tablo */
  table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
  th { background: #8B0000; color: white; padding: 10px; font-size: 14px; text-align: left; border-right: 1px solid #a00000; }
  th:last-child { border-right: none; }
  td { padding: 10px; border-bottom: 1px solid #ddd; font-size: 14px; text-align: left; }
  .sil-btn { background: #8B0000; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }

  /* Yazdır Butonu */
  .footer-action { text-align: center; }
  .btn-yazdir { background: #8B0000; color: white; border: none; padding: 12px 60px; font-size: 18px; font-weight: bold; border-radius: 6px; cursor: pointer; }
  .btn-yazdir:hover { background: #700000; }

  /* Uyarı Mesajı */
  #uyari { display: none; background: #ffcc00; color: #000; padding: 10px; text-align: center; font-weight: bold; margin-bottom: 15px; border-radius: 4px; }
</style>
</head>
<body>

<div class="modal-container">
  <div class="modal-header">
    ARAZİ PASİFLEME BEYANI
  </div>
  
  <div class="modal-body">
    <div id="uyari">DİKKAT: Ana sayfadan Kimlik/Vergi Numarası aktarılamadı! İşlem yapamazsınız.</div>

    <div class="info-box">
      <div><span id="lblKimlik">T.C. Kimlik No:</span> <span id="valKimlik" style="color:#000; font-weight:normal;">-</span></div>
      <div><span>Ad Soyad/Unvan:</span> <span id="valAdSoyad" style="color:#000; font-weight:normal;">-</span></div>
      <div><span>Köy/Mahalle:</span> <span id="valMahalle" style="color:#000; font-weight:normal;">-</span></div>
    </div>

    <div class="form-row">
      <select id="il"><option value="">İL</option></select>
      <select id="ilce" disabled><option>İLÇE</option></select>
      <select id="mahalleSelect" disabled><option>MAHALLE</option></select>
      <input id="ada" type="number" placeholder="Ada">
      <input id="parsel" type="number" placeholder="Parsel">
      <select id="tur"><option value="">TÜR</option><option>DİLEKÇE</option><option>FESİH</option></select>
      <button class="btn-ekle" onclick="ekle()">EKLE</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:30px; text-align:center;"><input type="checkbox" id="hepsiniSec" onchange="hepsiniSecDegistir(this.checked)"></th>
          <th>İl</th><th>İlçe</th><th>Mahalle</th><th>Ada</th><th>Parsel</th><th>Tür</th><th>İşlem</th>
        </tr>
      </thead>
      <tbody id="liste"></tbody>
    </table>

    <div class="footer-action">
      <button class="btn-yazdir" onclick="direkYazdir()">YAZDIR</button>
    </div>
  </div>
</div>

<script src="/kurum-ayar-client.js"></script>
<script>
// 1. PARAMETRELERİ YAKALA
const params = new URLSearchParams(window.location.search);
let numara = params.get('tc') || params.get('vergino') || params.get('vkn') || params.get('kimlik') || '';
numara = numara.trim();
const adsoyad = decodeURIComponent(params.get('adsoyad') || '').toUpperCase();
const mahalle = decodeURIComponent(params.get('mahalle') || '');

let etiketStr = "T.C. Kimlik No:";
let degerStr = numara;

if (!numara) {
  document.getElementById('uyari').style.display = 'block';
  etiketStr = "Kimlik/Vergi No:";
  degerStr = "BULUNAMADI!";
} else if (numara.length === 10) {
  etiketStr = "Vergi No:";
} else {
  etiketStr = "T.C. Kimlik No:";
}

document.getElementById('lblKimlik').textContent = etiketStr;
document.getElementById('valKimlik').textContent = degerStr;
document.getElementById('valAdSoyad').textContent = adsoyad || '-';
document.getElementById('valMahalle').textContent = mahalle || '-';

let iller = [], ilceler = [], mahalleler = [];
let kurumAyar = { il_adi: 'KONYA', ortak_kurum_adi: 'İLÇE TARIM VE ORMAN MÜDÜRLÜĞÜNE' }; // Varsayılanlar

// --- YENİ EKLENEN: GARANTİLİ KURUM AYARLARI ÇEKİMİ ---
const token = localStorage.getItem('token');
fetch('/api/kurum-ayarlari', {
    headers: { 'Authorization': 'Bearer ' + token }
})
.then(r => r.json())
.then(res => {
    if (res && res.success && res.data) {
        kurumAyar = res.data;
    }
})
.catch(err => console.error("Kurum ayarları çekilirken hata:", err));
// --------------------------------------------------------

function hepsiniSecDegistir(c) {
  document.querySelectorAll('#liste input.secim').forEach(x => x.checked = c);
}

// Veritabanından mevcut kayıtları getir
async function yukle() {
  if(!numara) return;
  try {
    const res = await fetch(`/api/pasifleme?tc=${numara}`);
    const data = await res.json();
    const tbody = document.getElementById('liste');
    tbody.innerHTML = '';
    data.forEach((item, i) => {
      const id = item.kimlik || item.id || i;
      tbody.innerHTML += `<tr data-id="${id}">
        <td style="text-align:center;"><input type="checkbox" class="secim" checked></td>
        <td>${item.il || ''}</td>
        <td>${item.ilçe || ''}</td>
        <td>${item.mahalle || ''}</td>
        <td>${item.ada || ''}</td>
        <td>${item.parsel || ''}</td>
        <td><b>${item.tur || ''}</b></td>
        <td><button class="sil-btn" onclick="sil(${id})">SİL</button></td>
      </tr>`;
    });
  } catch (e) { console.error("Veri çekilemedi", e); }
}

// Konum Yükleme
async function loadLocations() {
  try {
    if (typeof kurumAyarYukle === 'function') await kurumAyarYukle();
    const [a, b, c] = await Promise.all([fetch('/api/IL'), fetch('/api/ILCE'), fetch('/api/MAHALLE')]);
    iller = await a.json(); ilceler = await b.json(); mahalleler = await c.json();
    
    const ilSelect = document.getElementById('il');
    iller.forEach(x => ilSelect.innerHTML += `<option value="${x.İL}">${x.İL}</option>`);
    ilSelect.value = typeof kurumIlSec === 'function' ? kurumIlSec(iller) : (typeof kurumIlBuyuk === 'function' ? kurumIlBuyuk() : 'KONYA');
    fillIlce();
  } catch (e) { console.log("Konum hatası"); }
}

function fillIlce() {
  const il = document.getElementById('il').value;
  const ilceSelect = document.getElementById('ilce');
  ilceSelect.innerHTML = '<option value="">— İLÇE —</option>';
  ilceSelect.disabled = !il;
  
  if(il) {
    ilceler.filter(x => x.İL?.trim() === il).forEach(x => ilceSelect.innerHTML += `<option value="${x.İLÇE.trim()}">${x.İLÇE.trim()}</option>`);
    const filt = ilceler.filter(x => x.İL?.trim() === il);
    ilceSelect.value = typeof kurumIlceSec === 'function' ? kurumIlceSec(filt, il) : (typeof kurumIlceBuyuk === 'function' ? kurumIlceBuyuk() : 'SARAYÖNÜ');
  }
  fillMahalle();
}

function fillMahalle() {
  const il = document.getElementById('il').value;
  const ilce = document.getElementById('ilce').value;
  const mSelect = document.getElementById('mahalleSelect');
  mSelect.innerHTML = '<option value="">— MAHALLE —</option>';
  mSelect.disabled = !ilce;
  
  if(ilce) {
    mahalleler.filter(x => x.İL?.trim() === il && x.İLÇE?.trim() === ilce)
              .forEach(x => mSelect.innerHTML += `<option value="${x.MAHALLE.trim()}">${x.MAHALLE.trim()}</option>`);
  }
}

document.getElementById('il').onchange = fillIlce;
document.getElementById('ilce').onchange = fillMahalle;

// Yeni Kayıt Ekle
async function ekle() {
  if(!numara) return alert("Kimlik numarası eksik olduğu için işlem yapılamaz!");
  
  const yeni = {
    tc: numara,
    il: document.getElementById('il').value,
    ilce: document.getElementById('ilce').value, 
    mahalle: document.getElementById('mahalleSelect').value || mahalle,
    ada: document.getElementById('ada').value.trim(),
    parsel: document.getElementById('parsel').value.trim(),
    tur: document.getElementById('tur').value
  };

  if (!yeni.il || !yeni.ilce || !yeni.ada || !yeni.parsel || !yeni.tur) {
    return alert("Lütfen tüm alanları doldurun!");
  }

  try {
    const response = await fetch('/api/pasifleme', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(yeni)
    });
    
    const resData = await response.json();
    if(response.ok) {
      document.getElementById('ada').value = '';
      document.getElementById('parsel').value = '';
      document.getElementById('tur').value = '';
      yukle();
    } else {
      alert("Hata: " + (resData.hata || "Bilinmeyen bir hata oluştu"));
    }
  } catch (err) { alert("Sunucuya ulaşılamadı."); }
}

async function sil(id) {
  if (confirm('Bu parseli listeden silmek istediğinize emin misiniz?')) {
    await fetch(`/api/pasifleme/${id}`, { method: 'DELETE' });
    yukle();
  }
}

// 2. YAZDIRMA MANTIĞI: BİREBİR EKRANDAKİ DEĞERLERİ AL
// 2. YAZDIRMA MANTIĞI: BİREBİR EKRANDAKİ DEĞERLERİ AL
function direkYazdir() {
  const secilenler = Array.from(document.querySelectorAll('#liste input.secim:checked')).map((cb, i) => {
    const tr = cb.closest('tr');
    return {
      no: i + 1,
      il: tr.cells[1].textContent.trim(), ilce: tr.cells[2].textContent.trim(), mahalle: tr.cells[3].textContent.trim(),
      ada: tr.cells[4].textContent.trim(), parsel: tr.cells[5].textContent.trim()
    };
  });

  if (secilenler.length === 0) return alert("Lütfen yazdırılacak en az bir parsel seçin!");

  let satirlar = '';
  secilenler.forEach(p => {
    satirlar += `<tr><td>${p.no}</td><td>${p.il}</td><td>${p.ilce}</td><td>${p.mahalle}</td><td><b>${p.ada}</b></td><td><b>${p.parsel}</b></td></tr>`;
  });

  // Dinamik İl ve Ortak Kurum Adını Ayarla
  const antetIl = kurumAyar.il_adi ? kurumAyar.il_adi.toUpperCase() : 'KONYA';
  const hitapMakam = kurumAyar.ortak_kurum_adi ? kurumAyar.ortak_kurum_adi.toUpperCase() : 'İLÇE TARIM VE ORMAN MÜDÜRLÜĞÜNE';

  // Yazdırma şablonuna gidecek değişkenler
  const printHTML = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
  /* 1. ADIM: Tarayıcının 'about:blank' gibi üst/alt bilgilerini koyacak yer bırakmamak için sayfa margin'ini SIFIRLIYORUZ */
  @page { size: A4; margin: 0; } 
  
  /* 2. ADIM: Sayfanın margin'ini sıfırladığımız için yazılar kağıdın tam köşesine yapışmasın diye body'ye iç boşluk veriyoruz */
  @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  
  body { font-family: 'Times New Roman', Times, serif; font-size: 12pt; line-height: 1.2; color: #000; padding: 20mm; margin: 0; }
  
  /* Başlıkları bir araya topladık, çizgiyi kaldırdık */
  .antet-container { text-align: center; margin-bottom: 25px; }
  .orta { font-size: 15pt; font-weight:bold; margin:4px 0; }
  .kime { font-size: 16pt; font-weight:bold; margin-top: 8px; } /* border-bottom silindi */
  
  table { width:100%; border-collapse:collapse; margin:25px 0; }
  th { background:#f0f0f0; color:#000; padding:10px; font-size: 11pt; border:1px solid #000; font-weight: bold; }
  td { border:1px solid #000; padding:8px; text-align:center; font-size: 11pt; }
  
  .gereks { margin-top:25px; font-size: 12pt; line-height: 1.8; }
  
  /* İmza Alanı ve Tarih */
  .imza-alani { text-align:center; margin-top:40px; font-size: 12pt; float: right; width: 300px; }
  .clearfix::after { content: ""; clear: both; display: table; }
  </style></head><body onload="window.print();setTimeout(()=>window.close(),100)">
  
  <div class="antet-container">
    <div class="orta">T.C.</div>
    <div class="orta">${antetIl} VALİLİĞİ</div>
    <div class="kime">${hitapMakam}</div>
  </div>
  
  <p style="text-align:justify; margin-top: 20px; line-height: 1.5;">
    İlgili üretim yılı için vermiş olduğum Çiftçi Kayıt Sistemi güncelleme başvuru formunda bulunan parsel/parsellerin aşağıda belirtilen nedenden dolayı adıma olan kaydın silinerek pasiflenmesini istiyorum.
  </p>
  
  <h3 style="text-align:center; margin-top: 25px;">Pasif Hale Getirilmesi İstenen Parseller</h3>
  <table>
    <thead><tr><th>Sıra</th><th>İl</th><th>İlçe</th><th>Köy/Mahalle</th><th>Ada</th><th>Parsel</th></tr></thead>
    <tbody>${satirlar}</tbody>
  </table>
  
  <div class="gereks">
    <strong>Talebin Gerekçesi :</strong><br>
    [ &nbsp; ] Parsel/parselleri sattığımdan<br>
    [ &nbsp; ] Parsel/parselleri kiraya verdiğimden<br>
    [ &nbsp; ] Parselleri işlemediğimden<br>
    [ &nbsp; ] Çiftçiliği bıraktığımdan<br>
    [ &nbsp; ] Diğer : ................................................................................
  </div>
  
  <div class="clearfix">
      <div class="imza-alani">
        <div style="margin-bottom:15px; font-weight:bold;">${new Date().toLocaleDateString('tr-TR')}</div>
        
        <div style="margin-bottom:5px"><strong>${etiketStr}</strong> ${degerStr}</div>
        <div style="font-weight:bold; font-size:16px;">${adsoyad}</div>
        <div style="margin-top:15px;">İmza</div>
      </div>
  </div>
  
  </body></html>`;

  const win = window.open('', '_blank');
  win.document.open();
  win.document.write(printHTML);
  win.document.close();
  win.focus();
}

loadLocations();
yukle();
</script>
</body>
</html>
