<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Ek Evrak Dilekçesi</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f4f9;margin:0;padding:20px}
  .kutu{max-width:900px;margin:auto;background:white;padding:40px;border-radius:12px;box-shadow:0 6px 25px rgba(0,0,0,0.1)}
  h1{font-size:28px;text-align:center;margin-bottom:40px;color:#006400;border-bottom:3px solid #006400;padding-bottom:10px}
  .ekle-buton{text-align:center;margin:40px 0}
  .ekle-buton button{padding:20px 100px;background:#006400;color:white;border:none;border-radius:12px;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 10px 30px rgba(0,100,0,0.3)}
  .ekle-buton button:hover{background:#228B22;transform:translateY(-4px)}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{background:#006400;color:white;padding:16px;font-size:18px}
  td{padding:14px;border-bottom:1px solid #ddd;text-align:center;font-size:16px}
  .sil{background:#c62828;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
  .rapor-btn{margin:60px auto;display:block;padding:20px 80px;background:#c62828;color:white;border:none;border-radius:12px;font-size:26px;font-weight:bold;cursor:pointer}
  .baski {
  background:#006400;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin-left:8px;
}
.baski:hover {
  background:#228B22;
}
.tarih-alani {
  text-align: center; 
  margin-bottom: 15px;
  background: #e8f5e9;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #c8e6c9;
}
.temizle-btn {
  background:#c62828;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin-left:10px;
}
.temizle-btn:hover { background:#b71c1c; }
</style>
</head>
<body>

<div class="kutu">
  <h1>Ek evrak dilekçesi</h1>

  <div class="tarih-alani">
    <label for="kayitTarihi" style="font-size: 15px; font-weight: bold; margin-right: 10px; color: #006400;">
      Evrak Kayıt Tarihi (Boşsa anlık saati kaydeder):
    </label>
    <input type="datetime-local" id="kayitTarihi" style="padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px;">
    <button class="temizle-btn" onclick="document.getElementById('kayitTarihi').value=''">Tarihi Temizle</button>
  </div>

  <p id="kimlikUyari" style="display:none;text-align:center;color:#c62828;font-weight:bold;margin:12px 0;">
    Çiftçi kimlik numarası yok. Bu sayfayı dilekçe ekranındaki <b>Ek Evrak</b> menüsünden açın.
  </p>
  <div class="ekle-buton" style="margin-top: 10px;">
    <button id="ekleBtn" type="button" onclick="satirEkle()">EKLE</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>dosyano</th>
        <th>tarih</th>
        <th>ek</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody id="liste"></tbody>
  </table>

</div>

<div id="raporModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:9999;overflow:auto;">
  <div style="background:white;margin:20px auto;padding:20px;max-width:950px;border-radius:12px;position:relative;">
    <button onclick="document.getElementById('raporModal').style.display='none'" 
            style="position:absolute;top:10px;right:15px;background:#c62828;color:white;border:none;padding:12px 18px;border-radius:50%;font-size:24px;cursor:pointer;">
      ×
    </button>
    <iframe id="raporIframe" style="width:100%;height:96vh;border:none;"></iframe>
  </div>
</div>

<script>
const kimlikid = parseInt(new URLSearchParams(location.search).get('kimlik') || '', 10);
let kurumAyar = { ortak_kurum_adi: 'İLÇE GIDA TARIM ve HAYVANCILIK MÜDÜRLÜĞÜNE\nSARAYÖNÜ' };

// KURUM AYARLARINI ARKA PLANDA ÇEK
const globalToken = localStorage.getItem('token');
if (globalToken) {
  fetch('/api/kurum-ayarlari', { headers: { 'Authorization': 'Bearer ' + globalToken } })
  .then(r => r.json())
  .then(res => { if (res && res.success && res.data) kurumAyar = res.data; })
  .catch(e => console.log("Kurum ayarı çekilemedi."));
}

function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(m) {
        return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[m];
    });
}

// EKLE butonu
async function satirEkle() {
  if (!globalToken) {
    alert('Lütfen önce giriş yapın!');
    return;
  }
  if (!kimlikid || isNaN(kimlikid)) {
    alert('Geçersiz çiftçi kimliği. Sayfayı dilekçe ekranından tekrar açın.');
    return;
  }

  const btn = document.getElementById('ekleBtn');
  const eskiYazi = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Ekleniyor…';

  const secilenTarihVal = document.getElementById('kayitTarihi').value;
  let gonderilecekTarih = null;

  if (secilenTarihVal) {
    gonderilecekTarih = secilenTarihVal.replace('T', ' ') + ':00';
  }

  try {
    const res = await fetch('/api/ekevrak-ekle', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + globalToken
      },
      body: JSON.stringify({
        kimlikid: kimlikid,
        tarih: gonderilecekTarih
      })
    });

    let data = {};
    try {
      data = await res.json();
    } catch (_) {
      data = { success: false, message: 'Sunucu yanıtı okunamadı' };
    }

    if (res.ok && data.success) {
      await yukle();
    } else {
      alert(data.message || ('Ekleme başarısız (HTTP ' + res.status + ')'));
    }
  } catch (err) {
    alert('Bağlantı hatası: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = eskiYazi;
  }
}

async function yukle() {
  if (!globalToken || !kimlikid || isNaN(kimlikid)) return;

  const res = await fetch('/api/ekevrak-liste?kimlikid=' + kimlikid, {
    headers: { 'Authorization': `Bearer ${globalToken}` }
  });
  
  if (!res.ok) {
    document.getElementById('liste').innerHTML = '<tr><td colspan="4">Veri yüklenemedi veya yetki hatası.</td></tr>';
    return;
  }
  
  const data = await res.json();
  const tbody = document.getElementById('liste');
  tbody.innerHTML = '';
data.forEach(e => {
  tbody.innerHTML += `<tr data-id="${e.id}">
    <td><strong>${e.dosyano}</strong></td>
    <td>${new Date(e.tarih).toLocaleString('tr-TR', {year: 'numeric', month: '2-digit', day: '2-digit', hour:'2-digit', minute:'2-digit'})}</td>
    <td>${e.ek}</td>
    <td>
      <button class="sil" onclick='sil(${e.id})'>SİL</button>
      <button class="baski" onclick='bireyselRapor(${e.id})'>BASKI ÖNİZLEME</button>
    </td>
  </tr>`;
});
}

async function sil(id) {
  if (confirm('Silinsin mi?')) {
    if (!globalToken) {
      alert("Yetkisiz işlem.");
      return;
    }
    await fetch(`/api/ekevrak-sil/${id}`, { 
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${globalToken}` }
    });
    yukle();
  }
}

// Bireysel satır için rapor önizleme
async function bireyselRapor(id) {
  if (!globalToken) {
    alert("Yetkisiz işlem.");
    return;
  }

  try {
    const meRes = await fetch('/api/me', {
      headers: { 'Authorization': `Bearer ${globalToken}` }
    });
    const meData = await meRes.json();
    const personelAdSoyad = meData.success && meData.user.ad && meData.user.soyad 
      ? `${meData.user.ad} ${meData.user.soyad}`.toUpperCase() 
      : 'PERSONEL';

    const res = await fetch(`/api/ekevrak-liste?kimlikid=${kimlikid}`, {
      headers: { 'Authorization': `Bearer ${globalToken}` }
    });
    
    if (!res.ok) throw new Error("Veri alınamadı");

    const allData = await res.json();
    const satir = allData.find(e => Number(e.id) === Number(id));
    if (!satir) throw new Error("Satır bulunamadı");

    let formatliTarihSaat = '';
    let d = new Date();
    if(satir.tarih) {
       d = new Date(satir.tarih);
    }
    formatliTarihSaat = d.toLocaleString('tr-TR', { 
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });

    const adsoyadRaw = new URLSearchParams(location.search).get('adsoyad') || 'BİLİNMEYEN';
    const tcRaw = new URLSearchParams(location.search).get('tc') || 'YOK';
    const adsoyad = decodeURIComponent(adsoyadRaw);
    const tc = tcRaw;
    
    // Kurum Hitabı (Ayarlardan gelen)
    const hitapMakam = kurumAyar.ortak_kurum_adi ? kurumAyar.ortak_kurum_adi.toUpperCase().replace(/\n/g, '<br>') : 'İLÇE GIDA TARIM ve HAYVANCILIK MÜDÜRLÜĞÜNE<br>SARAYÖNÜ';

    const raporHTML = `<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Ek Evrak Dilekçesi</title>
<style>
  /* Sayfanın üst ve altındaki URL/Tarih izlerini yok eder */
  @page { margin: 0; size: auto; }
  @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; margin:0; } }
  
  body { 
    font-family: Arial, sans-serif; 
    margin: 0; 
    padding: 1.5cm; 
    line-height: 1.5; 
    font-size: 14px; 
  }
  
  .baslik { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 30px; }
  .sag-ust { text-align: right; margin-bottom: 25px; }
  .metin { text-align: justify; margin-bottom: 30px; }
  .ekler { margin: 30px 0; }
  .ek-satir { margin-bottom: 12px; }
  
  .imza-tablosu { 
    width: 100%; 
    margin-top: 40px; 
    border-collapse: collapse; 
    page-break-inside: avoid; 
    break-inside: avoid;      
  }
  
  .imza-tablosu th, .imza-tablosu td { border: 1px solid #000; padding: 12px; text-align: center; }
  .imza-alani { height: 20px; }
</style>
</head>
<body onload="window.print(); setTimeout(() => { 
  if (window.parent && window.parent.document && window.parent.document.getElementById('raporModal')) {
    window.parent.document.getElementById('raporModal').style.display = 'none';
  }
}, 1000);">

<div class="baslik">
  ${hitapMakam}
</div>

<div class="metin">
  Ekte vermiş olduğum arazi ve ürün beyanlarımın/güncellemelerimin, ilgili üretim yılı için vermiş olduğum Çiftçi Kayıt Sistemi güncelleme dosyasına eklenerek sisteme girilmesini istiyorum.<br><br>
  Gereğini arz ederim.
</div>

<div class="sag-ust">
  ${formatliTarihSaat}<br><br>
  Adı Soyadı, İmza<br>
  <strong>${adsoyad.toUpperCase()}</strong><br>
  T.C. ${tc}
</div>

<table>
<div class="ekler">
 <strong>EKLER :</strong>
    <tr>
    <th>B Formu </th><th>( ...... Adet )</th>
    </tr>
    <tr>
    <th>Çiftçi Belgesi</th><th>( ...... Adet )</th>
    </tr>
    <tr>
    <th>Kira Sözleşmesi</th><th>( ...... Adet )</th>
    </tr>
    <tr>
    <th>Muvafakatname</th><th>( ...... Adet )</th>
    </tr>
    <tr>
    <th>Taahhütname</th><th>( ...... Adet )</th>
    </tr>
    <tr>
    <th>..............</th><th>( ...... Adet )</th>
    </tr>
  </table>
  <br><br>
  Ek Sıra No: ${satir.ek}<br>
  Asıl Dosya No: ${satir.dosyano}<br><br><br><br><br><br>
</div>

<table class="imza-tablosu">
  <tr>
    <th></th>
    <th>KABUL EDEN PERSONELİN</th>
    <th>VERİ GİRİŞİ YAPAN PERSONELİN</th>
  </tr>
  <tr>
    <td>Adı-Soyadı<br><strong></strong></td>
    <td>${personelAdSoyad}</td>
    <td></td>
  </tr>
  <tr>
    <td>Unvanı</td>
    <td>MEMUR</td>
    <td></td>
  </tr>
  <tr>
    <td>Tarih/Saat</td>
    <td> ${formatliTarihSaat}</td>
    <td></td>
  </tr>
  <tr>
    <td class="imza-alani">İmza</td>
    <td class="imza-alani"></td>
    <td class="imza-alani"></td>
  </tr>
</table>

</body>
</html>`;

    const iframe = document.getElementById('raporIframe');
    const blob = new Blob([raporHTML], {type: 'text/html'});
    iframe.src = URL.createObjectURL(blob);

    document.getElementById('raporModal').style.display = 'block';

  } catch (err) {
    alert("Rapor oluşturulamadı: " + err.message);
  }
}

if (!kimlikid || isNaN(kimlikid)) {
  document.getElementById('kimlikUyari').style.display = 'block';
  document.getElementById('ekleBtn').disabled = true;
} else {
  yukle();
}
</script>
</body>
</html>
