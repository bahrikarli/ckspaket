<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Eksikler Listesi</title>
<style>
  body {font-family:Arial,sans-serif;background:#f4f4f9;margin:0;padding:20px}
  .kutu {max-width:1100px;margin:auto;background:white;padding:40px;border-radius:12px;box-shadow:0 6px 25px rgba(0,0,0,0.1)}
  h2 {font-size:26px;color:#006400;margin-bottom:30px}
  .giris {display:flex;gap:15px;margin-bottom:30px;align-items:center}
  .giris input {flex:1;padding:14px;font-size:16px;border:2px solid #006400;border-radius:8px}
  .giris button {padding:14px 40px;background:#006400;color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}
  .giris button:hover {background:#228B22}
  table {width:100%;border-collapse:collapse}
  th {background:#006400;color:white;padding:16px;text-align:center;font-size:17px}
  td {padding:14px;border-bottom:1px solid #ddd;text-align:center}
  .sil {background:#c62828;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer}
  .sil:hover {background:#a00}
  .bos {text-align:center;color:#666;padding:40px;font-size:18px}
</style>
</head>
<body>

<div class="kutu">
  <h2>Eksikleri Giriniz :</h2>

  <div class="giris">
    <input type="text" id="yeniEksik" placeholder="Eksik açıklamasını yazın...">
    <button onclick="eksikEkle()">Ekle</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Eksikler</th>
        <th>Tarih</th>
        <th>Durum</th>

      </tr>
    </thead>
    <tbody id="liste">
      <tr><td colspan="4" class="bos">Yükleniyor...</td></tr>
    </tbody>
  </table>
</div>
<!-- EKSİKLER MODAL -->
<div id="eksiklerModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:99999;justify-content:center;align-items:center;">
  <div style="background:white;width:95%;max-width:1200px;height:95%;border-radius:20px;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,0.8);display:flex;flex-direction:column;">
    <div style="background:#e67e22;color:white;padding:20px;font-size:26px;text-align:center;position:relative;">
      EKSİKLER
      <span onclick="document.getElementById('eksiklerModal').style.display='none'" 
            style="position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:35px;cursor:pointer;font-weight:bold;">×</span>
    </div>
    <iframe id="eksiklerIframe" style="width:100%;height:100%;border:none;" src=""></iframe>
  </div>
</div> <!-- BURADA KAPANIYOR -->

</body>
</html>
<!-- DÜZENLEME MODALI -->
<div id="duzenleModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:99999;justify-content:center;align-items:center;">
  <div style="background:white;padding:30px;border-radius:12px;width:90%;max-width:500px;box-shadow:0 10px 30px rgba(0,0,0,0.3);position:relative;">
    <span onclick="document.getElementById('duzenleModal').style.display='none'" 
          style="position:absolute;top:10px;right:15px;font-size:30px;cursor:pointer;color:#c62828;">×</span>
    <h3 style="color:#006400;margin-bottom:20px;">Ek Düzenle</h3>
    <input type="text" id="duzenleInput" style="width:100%;padding:12px;font-size:16px;border:2px solid #006400;border-radius:8px;margin-bottom:20px;">
    <select id="duzenleDurum" style="width:100%;padding:12px;font-size:16px;border:2px solid #006400;border-radius:8px;margin-bottom:20px;">
  <option value="">- Seçiniz -</option>
  <option value="EKSİK">EKSİK</option>
  <option value="TAMAMLANDI">TAMAMLANDI</option>
</select>
    <div style="text-align:right;">
      <button onclick="duzenleKaydet()" style="padding:12px 30px;background:#006400;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Kaydet</button>
      <button onclick="document.getElementById('duzenleModal').style.display='none'" style="padding:12px 30px;background:#ccc;color:#333;border:none;border-radius:8px;margin-left:10px;cursor:pointer;">İptal</button>
    </div>
  </div>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const kimlikid = urlParams.get('kimlik');
if (!kimlikid) {
  document.body.innerHTML = "<h2 style='text-align:center;color:red;'>Çiftçi bilgisi bulunamadı!</h2>";
}

// Token al
const token = localStorage.getItem('token');
let currentUserName = "Personel";

fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } })
  .then(r => r.json())
  .then(d => {
    if (d.success && d.user) {
      currentUserName = (d.user.ad + ' ' + d.user.soyad).trim() || d.user.kullaniciadi || 'Personel';
    }
  });
// Eksik ekle

async function authMiddleware(req, res, next) {
  const authHeader = req.headers['authorization'];
  const token = authHeader && authHeader.split(' ')[1];

  if (!token) {
    return res.sendStatus(401);
  }

  jwt.verify(token, process.env.JWT_SECRET || 'secret', async (err, decoded) => {
    if (err) {
      return res.sendStatus(403);
    }

    try {
      const pool = await getPool();
      const result = await pool.request()
        .input('id', sql.Int, decoded.id)  // decoded.id varsa, yoksa decoded.kullaniciadi kullan
        .query(`SELECT Id, KullaniciAdi, Ad, Soyad FROM Kullanicilar WHERE Id = @id`);

      if (result.recordset.length > 0) {
        const u = result.recordset[0];
        req.user = {
          id: u.Id,
          kullaniciadi: u.KullaniciAdi,
          ad: u.Ad || '',
          soyad: u.Soyad || ''
        };
      } else {
        req.user = { id: decoded.id, kullaniciadi: 'Bilinmeyen' };
      }
    } catch (dbErr) {
      console.error("Kullanıcı bilgisi çekilemedi:", dbErr);
      req.user = { id: decoded.id, kullaniciadi: 'Bilinmeyen' };
    }

    next();
  });
}

async function eksikEkle() {
  const input = document.getElementById('yeniEksik');
  const eksik = input.value.trim();
  if (!eksik) {
    alert("Lütfen eksik açıklamasını yazın!");
    return;
  }

  const token = localStorage.getItem('token');
  if (!token) {
    alert("Oturum kapalı!");
    return;
  }

  try {
    const res = await fetch('/api/eksik-ekle', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({
        kimlikid: kimlikid,
        eksikler: eksik,
        kullanici: currentUserName  // ADI SOYADI GÖNDER
      })
    });

    if (res.ok) {
      input.value = '';
      yukle();
    } else {
      alert("Ekleme başarısız!");
    }
  } catch (err) {
    alert("Bağlantı hatası!");
  }
}
async function yukle() {
  const token = localStorage.getItem('token');
  if (!token) {
    document.getElementById('liste').innerHTML = '<tr><td colspan="4" class="bos">Oturum kapalı! Lütfen giriş yapın.</td></tr>';
    return;
  }

  try {
    const res = await fetch(`/api/eksik-liste?kimlikid=${kimlikid}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });

    if (!res.ok) {
      document.getElementById('liste').innerHTML = '<tr><td colspan="4" class="bos">Bağlantı hatası veya yetki sorunu.</td></tr>';
      return;
    }

    const data = await res.json();
    const tbody = document.getElementById('liste');
    tbody.innerHTML = '';
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="bos">Henüz eksik girilmemiş.</td></tr>';
      return;
    }

data.forEach(e => {
  const tarih = new Date(e.tarih).toLocaleDateString('tr-TR');
  
  const durum = (e.durum && e.durum.trim() !== '') ? e.durum.trim().toUpperCase() : 'EKSİK';
  

  // ÇİFT TIKLAMA BURAYA EKLENDİ
  tbody.innerHTML += `<tr data-id="${e.Kimlik}" ondblclick="duzenleAc(${e.Kimlik}, '${e.eksikler.replace(/'/g, "\\'")}', '${e.durum || ''}')">
    <td>${e.eksikler}</td>
    <td>${tarih}</td>
    <td><strong>${durum}</strong></td>
    
    <td>
      <button class="sil" onclick="event.stopPropagation(); eksikSil(${e.Kimlik})">SİL</button>
    </td>
  </tr>`;
});
  } catch (err) {
    document.getElementById('liste').innerHTML = '<tr><td colspan="4" class="bos">Bağlantı hatası.</td></tr>';
  }
}

// Sil
async function eksikSil(id) {
  if (!confirm('Bu eksik silinsin mi?')) return;

  try {
    await fetch(`/api/eksik-sil/${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token }
    });
    yukle();
  } catch (err) {
    alert("Silme başarısız!");
  }
}
async function satirEkle() {
  const token = localStorage.getItem('token');
  if (!token) {
    alert("Lütfen önce giriş yapın!");
    return;
  }

  // Bu çiftçi için mevcut ek sayısı
  const listeRes = await fetch(`/api/eksik-liste?kimlikid=${kimlikid}`, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  const mevcutData = await listeRes.json();
  const ekSayisi = mevcutData.length;

  const ekMetni = ekSayisi === 0 ? "EKSİK" : (ekSayisi + 1).toString();

  const res = await fetch('/api/eksik-ekle', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    },
    body: JSON.stringify({ 
        eksikler: yeniEksik,
        durum: yeniDurum,
      kimlikid: kimlikid,
      ekMetni: ekMetni  // sunucuya gönder
    })
  });

  if (res.ok) {
    yukle();
  } else {
    alert("Ekleme başarısız!");
  }
}
let duzenlenenId = null;

// Çift tıklama ile modal aç
function duzenleAc(id, mevcutEksik, mevcutDurum) {
  duzenlenenId = id;
  document.getElementById('duzenleInput').value = mevcutEksik || '';
  
  const select = document.getElementById('duzenleDurum');
  select.value = ''; // önce temizle
  if (mevcutDurum && mevcutDurum.trim() !== '') {
    select.value = mevcutDurum.trim().toUpperCase(); // "eksik" veya "tamamlandı" olursa büyük harfe çevir
  }
  
  document.getElementById('duzenleModal').style.display = 'flex';
}

// Kaydet
async function duzenleKaydet() {
  const yeniEksik = document.getElementById('duzenleInput').value.trim();
  const yeniDurum = document.getElementById('duzenleDurum').value;

  if (!yeniEksik) {
    alert("Eksik açıklaması boş olamaz!");
    return;
  }

  const token = localStorage.getItem('token');
  if (!token) {
    alert("Oturum kapalı!");
    return;
  }

  try {
    const res = await fetch(`/api/eksik-duzenle/${duzenlenenId}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ 
        eksikler: yeniEksik,
        durum: yeniDurum 
      })
    });

    if (res.ok) {
      document.getElementById('duzenleModal').style.display = 'none';
      yukle();
    } else {
      alert("Düzenleme başarısız!");
    }
  } catch (err) {
    alert("Bağlantı hatası!");
  }
}

yukle();
</script>

</body>
</html>
