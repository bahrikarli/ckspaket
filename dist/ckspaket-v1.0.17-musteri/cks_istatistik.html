<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ÇKS İstatistikleri</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; margin: 0; padding: 15px; color: #333; }
    
    .modal-container { 
        max-width: 1200px; 
        margin: auto; 
        background: white; 
        border-radius: 12px; 
        box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
        overflow: hidden;
    }

    .modal-top-bar {
        background: #006400;
        color: white;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
        font-size: 16px;
    }
    .close-icon { cursor: pointer; font-size: 20px; opacity: 0.8; }

    .modal-body { padding: 25px 30px; }

    h1.dinamik-kurum { 
        font-size: 24px; 
        color: #006400; 
        margin: 0 0 15px 0; 
        text-align: center; 
        font-weight: 800; 
        text-transform: uppercase; 
    }
    .divider { height: 1px; background: #eee; width: 100%; margin-bottom: 25px; }
    
    /* 🎯 ÜST KARTLAR: TAM 4'LÜ YAN YANA DÜZEN */
    .genel { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr); /* Zorunlu 4 sütun */
        gap: 15px; 
        margin-bottom: 30px; 
    }
    
    .kart { 
        background: white; 
        padding: 15px 10px; 
        border-radius: 10px; 
        text-align: center; 
        border: 1px solid #eee;
        transition: 0.3s;
    }
    .kart:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
    
    .kart-toplam { border-bottom: 4px solid #3498db; }
    .kart-yapildi { border-bottom: 4px solid #27ae60; }
    .kart-bekleyen { border-bottom: 4px solid #e74c3c; background: #fffcfc; }
    .kart-tkgm { border-bottom: 4px solid #f39c12; background: #fffdf9; }

    .kart i { font-size: 22px; margin-bottom: 10px; }
    .kart-toplam i { color: #3498db; }
    .kart-yapildi i { color: #27ae60; }
    .kart-bekleyen i { color: #e74c3c; }
    .kart-tkgm i { color: #f39c12; }

    .kart h3 { font-size: 11px; color: #7f8c8d; margin: 0 0 5px 0; font-weight: 700; text-transform: uppercase; }
    .kart .sayi { font-size: 30px; font-weight: 900; color: #2c3e50; margin-bottom: 2px; }
    .kart .aciklama { font-size: 10px; color: #bdc3c7; }

    /* Tabloları 3'lü yan yana dizen ana yapı */
/* 4'lü Yan Yana Yapı */
#tablolar {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 8px !important;
    margin-top: 15px;
    align-items: start;
    width: 100%;
}

.tablo-kutu {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;
    min-width: 0; /* Taşmayı engeller */
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed; /* 🎯 Kritik: Sütun genişliklerini sabit tutar */
}

/* İsim Sütunu */
td:first-child {
    padding: 6px 4px !important;
    font-size: 10.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis; /* İsim çok uzunsa sığdırır */
}

/* 🎯 Rakam Sütunu (Sığmayan yer burasıydı) */
td:last-child {
    text-align: right;
    width: 45px; /* Genişliği 45px'e sabitledik, 4 haneli rakamlar sığar */
    font-weight: 800;
    font-size: 11px;
    color: #2e7d32;
    padding-right: 8px !important;
}

.kullanici-avatar {
    width: 18px; /* Avatarları biraz daha küçülttük */
    height: 18px;
    font-size: 8px;
    flex-shrink: 0;
}

.tablo-header {
    font-size: 10px;
    padding: 8px;
    text-align: center;
    font-weight: bold;
    text-transform: uppercase;
    background: #fcfdfc;
}
    
    table { width: 100%; border-collapse: collapse; }
    th { background: #fff; color: #95a5a6; padding: 8px 15px; font-size: 10px; text-align: left; text-transform: uppercase; border-bottom: 1px solid #f1f1f1; }
    th:last-child { text-align: right; }
    
    td { padding: 8px 15px; border-bottom: 1px solid #f9f9f9; font-size: 13px; color: #34495e; }
    td:last-child { text-align: right; font-weight: 800; color: #006400; font-size: 14px; }
    tr:hover { background: #f8faf8; }

    .kullanici-hucre { display: flex; align-items: center; gap: 10px; }
    .kullanici-avatar { 
        width: 28px; height: 28px; 
        background: #e8f5e8; color: #006400; 
        border-radius: 50%; 
        display: flex; align-items: center; justify-content: center; 
        font-size: 11px; font-weight: bold;
        border: 1px solid #d0e8d0;
    }

    .yukleniyor { font-size: 18px; color: #006400; margin: 60px 0; text-align: center; }
    .tarih-footer { text-align: center; margin-top: 20px; font-size: 11px; color: #bdc3c7; }

    @media (max-width: 900px) {
        .genel { grid-template-columns: 1fr 1fr; }
        .tablolar { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<div class="modal-container">
    <div class="modal-top-bar">
        <span>ÇKS İSTATİSTİKLERİ</span>
        <i class="fas fa-times close-icon" onclick="window.parent.document.getElementById('istatistikModal').style.display='none'"></i>
    </div>

    <div class="modal-body">
        <h1 class="dinamik-kurum">SARAYÖNÜ ZİRAAT ODASI BAŞKANLIĞI</h1>
        <div class="divider"></div>
        
        <div class="yukleniyor" id="yukleniyor">
            <i class="fas fa-circle-notch fa-spin"></i><br>Veriler Hesaplanıyor...
        </div>

        <div class="genel" id="genelIstatistik" style="display:none;">
            <div class="kart kart-toplam">
                <i class="fas fa-folder-open"></i>
                <h3>TOPLAM DİLEKÇE</h3>
                <div class="sayi" id="toplam">0</div>
                <div class="aciklama">Tüm Dosyalar</div>
            </div>
            <div class="kart kart-yapildi">
                <i class="fas fa-check-circle"></i>
                <h3>ÇKS YAPILDI</h3>
                <div class="sayi" id="yapildi">0</div>
                <div class="aciklama">Sisteme Girilen</div>
            </div>
            <div class="kart kart-bekleyen">
                <i class="fas fa-hourglass-start"></i>
                <h3>BEKLEYEN</h3>
                <div class="sayi" id="bekleyen">0</div>
                <div class="aciklama">Giriş Bekleyen</div>
            </div>
            <div class="kart kart-tkgm">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>TKGM EKSİK</h3>
                <div class="sayi" id="tkgmGirilmeyen">0</div>
                <div class="aciklama">Tarbis Notu Yok</div>
            </div>
        </div>

<div class="tablolar" id="tablolar" style="display:none;">
    <div class="tablo-kutu">
        <div class="tablo-header"><i class="fas fa-user-edit"></i> KABUL</div>
        <table><tbody id="kabulBody"></tbody></table>
    </div>

    <div class="tablo-kutu">
        <div class="tablo-header"><i class="fas fa-desktop"></i> GİRİŞ</div>
        <table><tbody id="cksBody"></tbody></table>
    </div>

    <div class="tablo-kutu">
        <div class="tablo-header"><i class="fas fa-print"></i> TARAMA</div>
        <table><tbody id="taramaBody"></tbody></table>
    </div>

    <div class="tablo-kutu">
        <div class="tablo-header"><i class="fas fa-file-import"></i> BELGENET</div>
        <table><tbody id="belgenetBody"></tbody></table>
    </div>
</div>

        <div class="tarih-footer">Rapor Saati: <span id="tarih"></span></div>
    </div>
</div>

<script>
const token = localStorage.getItem('token');

if (token) {
    fetch('/api/kurum-ayarlari', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(r => r.json())
    .then(res => {
        if (res && res.success && res.data) {
            const anaKurum = res.data.kurum_adi || 'SARAYÖNÜ ZİRAAT ODASI BAŞKANLIĞI';
            document.querySelectorAll('.dinamik-kurum').forEach(el => el.textContent = anaKurum);
        }
    });
}

function getInitials(name) {
    if(!name || name === 'Belirtilmemiş') return '?';
    const parts = name.trim().split(' ');
    if(parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    return parts[0][0].toUpperCase();
}

// Fonksiyonu window seviyesine çıkartıyoruz ki ana sayfadan (parent) tetiklenebilsin
window.istatistikYukle = async function() {
    try {
        // 1. Arayüzü Temizle
        document.getElementById('yukleniyor').style.display = 'block';
        document.getElementById('genelIstatistik').style.display = 'none';
        document.getElementById('tablolar').style.display = 'none';

        const kBody = document.getElementById('kabulBody');
        const cBody = document.getElementById('cksBody');
        const tBody = document.getElementById('taramaBody');
        const bBody = document.getElementById('belgenetBody');

        if (kBody) kBody.innerHTML = '';
        if (cBody) cBody.innerHTML = '';
        if (tBody) tBody.innerHTML = '';
        if (bBody) bBody.innerHTML = '';

        const aktifYil = localStorage.getItem('aktifCksYili') || '2026';
        const taze = new Date().getTime();

        // 2. API'den Veri Çek
        const [statRes, tkgmRes] = await Promise.all([
            fetch(`/api/cks-istatistik-detayli?yil=${aktifYil}&t=${taze}`, { 
                headers: { 'Authorization': 'Bearer ' + token } 
            }),
            fetch(`/api/tkgm-girilmeyen-sayi?yil=${aktifYil}&t=${taze}`, { 
                headers: { 'Authorization': 'Bearer ' + token } 
            })
        ]);

        const veri = await statRes.json();
        const tkgmVeri = await tkgmRes.json();

        // 3. Üst Kartları Doldur
        document.getElementById('toplam').textContent = (veri.genel?.toplam || 0).toLocaleString('tr-TR');
        document.getElementById('yapildi').textContent = (veri.genel?.yapildi || 0).toLocaleString('tr-TR');
        document.getElementById('bekleyen').textContent = (veri.genel?.bekleyen || 0).toLocaleString('tr-TR');
        document.getElementById('tkgmGirilmeyen').textContent = (tkgmVeri?.tkgm_girilmeyen || 0).toLocaleString('tr-TR');

        // 4. Tablo: KABUL
        if (veri.kabul && veri.kabul.length > 0) {
            veri.kabul.forEach(k => {
                if (kBody) kBody.innerHTML += `<tr><td><div class="kullanici-hucre"><div class="kullanici-avatar">${getInitials(k.kullanıcı)}</div><span>${k.kullanıcı}</span></div></td><td>${k.sayi}</td></tr>`;
            });
        }

        // 5. Tablo: ÇKS GİRİŞİ
        if (veri.cks && veri.cks.length > 0) {
            veri.cks.forEach(c => {
                if (cBody) cBody.innerHTML += `<tr><td><div class="kullanici-hucre"><div class="kullanici-avatar" style="background:#e3f2fd; color:#1565c0;">${getInitials(c.kullanıcı)}</div><span>${c.kullanıcı}</span></div></td><td>${c.sayi}</td></tr>`;
            });
        }

        // 6. Tablo: EVRAK TARAMA (kullanıcı kolonu verisi)
        if (veri.tarama && veri.tarama.length > 0) {
            veri.tarama.forEach(t => {
                if (tBody) {
                    tBody.innerHTML += `
                        <tr>
                            <td>
                                <div class="kullanici-hucre">
                                    <div class="kullanici-avatar" style="background:#fff3e0; color:#e65100;">${getInitials(t.kullanıcı)}</div>
                                    <span>${t.kullanıcı}</span>
                                </div>
                            </td>
                            <td>${t.sayi}</td>
                        </tr>`;
                }
            });
        }

        // 7. Tablo: BELGENET GİRİŞ (bkullanici kolonu verisi)
        if (veri.belgenet && veri.belgenet.length > 0) {
            veri.belgenet.forEach(b => {
                if (bBody) {
                    bBody.innerHTML += `
                        <tr>
                            <td>
                                <div class="kullanici-hucre">
                                    <div class="kullanici-avatar" style="background:#f1f8e9; color:#33691e;">${getInitials(b.kullanıcı)}</div>
                                    <span>${b.kullanıcı}</span>
                                </div>
                            </td>
                            <td>${b.sayi}</td>
                        </tr>`;
                }
            });
        }

        // 8. Arayüzü Göster
        document.getElementById('yukleniyor').style.display = 'none';
        document.getElementById('genelIstatistik').style.display = 'grid';
        document.getElementById('tablolar').style.display = 'grid';
        document.getElementById('tarih').textContent = `${aktifYil} Dönemi Raporu - ${new Date().toLocaleString('tr-TR')}`;

    } catch (err) {
        console.error("Hata:", err);
        document.getElementById('yukleniyor').innerHTML = `<div style="color:red; padding:20px;">Veriler yüklenemedi! Lütfen sayfayı yenileyin.</div>`;
    }
};
istatistikYukle();
</script>
</body>
</html>
